<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    Alias /healthz.php /opt/ralmaster/healthz.php
    <Directory /opt/ralmaster>
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <LocationMatch "^/(local/templates|bitrix/(css|js|cache/(css|js)))/.*\\.(css|js|gif|jpe?g|png|svg|webp|avif|ico|woff2?|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <LocationMatch "^/upload/.*\\.(gif|jpe?g|png|svg|webp|avif|ico|woff2?)$">
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
        Header always set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    <LocationMatch "^/bitrix/images/.*\\.(gif|jpe?g|png|svg|webp|avif|ico)$">
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
        Header always set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    <LocationMatch "(?i)^/upload/.*\\.(?:php[0-9]?|phtm|phtml|pht|phar|pl|py|rb|cgi|fcgi|fpl|asp|aspx|asmx|shtm|shtml|jsp|sh|bash|exe|dll)(?:\\.|$)">
        Require all denied
    </LocationMatch>

    Header unset X-Powered-By
    Header always unset X-Powered-By
    Header unset X-Powered-CMS
    Header always unset X-Powered-CMS
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "frame-ancestors 'self'"

    SetEnvIf Request_URI "^/(ajax|login|cabinet|cart|form|bitrix/admin)(/|$)" RALMASTER_NOSTORE=1
    Header always set Cache-Control "no-store, private" env=RALMASTER_NOSTORE
    Header always set Pragma "no-cache" env=RALMASTER_NOSTORE

    RedirectMatch 404 ^/(\.git|\.github|docker|deploy|docs|tests|node_modules|test-results|playwright-report|outputs?|artifacts?)(/|$)
    RedirectMatch 404 ^/(?:\.env(?:\..*)?|\.htaccess_back|Dockerfile|compose(?:\.[^/]*)?\.ya?ml|package(?:-lock)?\.json|playwright\.config\..*|deploy\.log|README(?:\..*)?|[^/]+\.(?:sql|sqlite3?|bak|backup|old|orig|log|tar|tgz|gz|zip|7z))$

    <FilesMatch "(?i)(^\.|^\.htaccess_back$|^(Dockerfile|compose.*\.ya?ml|package(-lock)?\.json|playwright\.config\..*|deploy\.log|README(?:\..*)?)$|\.(?:env|ini|log|sql|sqlite3?|bak|backup|old|orig|save|swp)$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
