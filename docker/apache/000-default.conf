<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    Alias /healthz.php /opt/ralmaster/healthz.php
    <Directory /opt/ralmaster>
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <LocationMatch "^/(local/templates|bitrix/(css|js|cache/(css|js)))/.*\\.(css|js|gif|jpe?g|png|svg|webp|avif|ico|woff2?|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <LocationMatch "^/upload/.*\\.(gif|jpe?g|png|svg|webp|avif|ico|woff2?)$">
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
        Header always set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    <LocationMatch "^/bitrix/images/.*\\.(gif|jpe?g|png|svg|webp|avif|ico)$">
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
        Header always set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"

    RedirectMatch 404 ^/(\.git|docker|docs|tests|node_modules)(/|$)

    <FilesMatch "(^\.|^(Dockerfile|compose.*\.ya?ml|package(-lock)?\.json|playwright\.config\..*)$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
