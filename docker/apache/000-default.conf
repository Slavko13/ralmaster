<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    Alias /healthz.php /opt/ralmaster/healthz.php
    <Directory /opt/ralmaster>
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    RedirectMatch 404 ^/(\.git|docker|docs|tests|node_modules)(/|$)

    <FilesMatch "(^\.|^(Dockerfile|compose.*\.ya?ml|package(-lock)?\.json|playwright\.config\..*)$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
