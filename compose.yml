name: ${DEV_COMPOSE_PROJECT_NAME:-ralmaster-redesign}

services:
  db:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${BITRIX_DB_NAME:-bitrix}
      MYSQL_USER: ${BITRIX_DB_USER:-bitrix}
      MYSQL_PASSWORD: ${BITRIX_DB_PASSWORD:-bitrix_local_only}
      MYSQL_ROOT_PASSWORD: ${BITRIX_DB_ROOT_PASSWORD:-bitrix_root_local_only}
      TZ: ${TZ:-Europe/Moscow}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - bitrix-db:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      APP_ENV: development
      BITRIX_DB_HOST: db
      BITRIX_DB_PORT: 3306
      BITRIX_DB_NAME: ${BITRIX_DB_NAME:-bitrix}
      BITRIX_DB_USER: ${BITRIX_DB_USER:-bitrix}
      BITRIX_DB_PASSWORD: ${BITRIX_DB_PASSWORD:-bitrix_local_only}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - 127.0.0.1:${APP_PORT:-8080}:80
    volumes:
      - .:/var/www/html
      - ./docker/bitrix/.settings_extra.php:/var/www/html/bitrix/.settings_extra.php:ro
      - ./docker/bitrix/dbconn.php:/var/www/html/bitrix/php_interface/dbconn.php:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  bitrix-db:
